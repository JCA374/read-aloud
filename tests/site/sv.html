<body><article><h1>Fyrvaktaren</h1>
<p>Stormen kom strax efter midnatt. Hon kontrollerade lampan två gånger, t.ex. med den gamla nyckeln, och gick sedan upp för den smala trappan.</p>
<p>Nedanför bröts vågorna mot klipporna med ett ljud som avlägset åska. Ingen skulle komma i natt.</p></article></body></html>
