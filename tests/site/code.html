<h1>Counting lines</h1>
<p>This short script counts the lines in a file. It is only a few words long.</p>
<pre><code>const lines = text.split("\n");
console.log(lines.length, "lines");</code></pre>
<figure><img alt="" width="40" height="20" src="data:image/gif;base64,R0lGODlhAQABAAAAACw="><figcaption>A picture of a terminal window with the count. The script was run three times on the same file, and each time it printed the same number of lines, which shows that the count does not change between runs. The window is dark with light letters.</figcaption></figure>
<p>Run it with any text file. The number it prints is the answer.</p>
</article></body></html>
