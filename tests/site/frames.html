<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Frames</title>
  <style>body { font-family: sans-serif; max-width: 900px; margin: 2em auto; } iframe { width: 100%; height: 600px; border: 1px solid #ccc; }</style>
</head>
<body>
  <h1>A page with frames</h1>
  <p>The article below is shown in a frame from another site, as an artifact on claude.ai is.</p>
  <!-- the article: another origin (localhost, not 127.0.0.1), in a sandbox like an embedded document -->
  <iframe id="article" src="http://localhost:8799/long.html" sandbox="allow-scripts"></iframe>
  <!-- a tiny frame with text (an ad or a tracker): must never be picked -->
  <iframe id="tiny" src="http://localhost:8799/sv.html" style="width: 1px; height: 1px"></iframe>
</body>
</html>
