<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Neural Voices</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon32.png" alt="">
    <h1>Neural Voices</h1>
  </header>

  <div id="nopage" class="notice" hidden>
    Can't read this page. Reload it, or try a normal web page (browser pages can't be read).
  </div>

  <div class="actions">
    <button id="read" class="primary">Read page</button>
    <button id="click">Click-to-read</button>
    <button id="stop">Stop</button>
  </div>

  <label>English voice
    <select id="voice"></select>
  </label>
  <label>Swedish voice <small>(used automatically on Swedish text)</small>
    <select id="voiceSv"></select>
  </label>
  <label>Speed <output id="speedOut"></output>
    <input id="speed" type="range" min="0.75" max="2" step="0.05">
  </label>

  <p class="keys">
    <kbd>Alt+Shift+R</kbd> read / pause &nbsp; <kbd>Alt+Shift+X</kbd> stop<br>
    Select text and click the speaker, or right-click → “Read aloud”.
  </p>
  <script src="popup.js"></script>
</body>
</html>
