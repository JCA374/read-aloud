<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Piper WASM test</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 16px; }
  button { font: inherit; padding: .4rem .9rem; margin: 0 .4rem .4rem 0; }
  pre { background: #f3f3f3; padding: .8rem; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Piper in WebAssembly: test</h1>
<p>Each button speaks one sentence with no server. The first run downloads the voice (about 60 MB).</p>
<button data-voice="sv_SE-alma-medium" data-text="Hej, hur mår du idag?">Swedish (Alma)</button>
<button data-voice="en_GB-cori-medium" data-text="Hello, this voice runs entirely inside the browser.">English (Cori)</button>
<pre id="log"></pre>
<script src="poc.js"></script>
</body>
</html>
